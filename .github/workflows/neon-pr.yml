# Branch-per-pull-request against Neon.
#
# Every PR that touches neon/ gets its OWN Postgres database: a copy-on-write
# branch of production, created in seconds, with production's data in it. The
# migrations run there and the tests run against real Postgres - real
# constraints, real planner - then the branch is deleted when the PR closes.
#
# Why this instead of a shared staging database:
#   * two PRs cannot corrupt each other's schema, because they are not sharing one;
#   * a migration is proven against production-shaped DATA, not an empty schema,
#     which is where migrations actually fail;
#   * teardown is total - no drift accumulating in a long-lived staging box.
#
# Two free-plan limits shape this file, and both bite quietly:
#   * 10 branches per project. The cleanup job is not tidiness, it is what keeps
#     the 11th pull request from failing outright.
#   * 100 CU-hours/month, and 0.5 GB storage shared across ALL branches. Hence
#     the paths filter - an unrelated PR should not spin up a database.
#
# Setup (once, by Eric):
#   gh secret set NEON_API_KEY   --repo ericbackman/data_explorer
#   gh variable set NEON_PROJECT_ID --repo ericbackman/data_explorer

name: neon-pr

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "neon/**"
      - ".github/workflows/neon-pr.yml"

concurrency:
  # One run per PR. A rapid second push should cancel the first rather than race
  # it applying migrations to the same branch.
  group: neon-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  migrate-and-test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet "psycopg[binary]" pytest

      - name: Create Neon branch for this PR
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # db_url embeds a password, so it is only ever passed through env - never
      # echoed, never interpolated into a `run:` string where it would land in
      # the log.
      - name: Show migration status before
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: python neon/migrate.py --status || true

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: python neon/migrate.py

      - name: Run tests against the branch
        env:
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: python -m pytest neon/test_schema.py -v

      - name: Comment the branch on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Neon branch `pr-${{ github.event.number }}`',
              '',
              'Migrations applied and schema tests passed against a copy-on-write',
              'branch of production data. The branch is deleted when this PR closes.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            // Update in place rather than adding a comment per push.
            const mine = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### Neon branch'));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body });
            }

  cleanup:
    # Runs on close whether or not the PR merged, and `always()` so a failed test
    # run still gives the branch back. Without this the project silently fills up
    # and the 11th PR cannot create one at all.
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the PR's Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

permissions:
  contents: read
  pull-requests: write
