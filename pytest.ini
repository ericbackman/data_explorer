[pytest]
# importlib import mode, because three sports packages each ship a
# `tests/test_parse.py`. Under pytest's default "prepend" mode those collide on
# module name and abort collection with "import file mismatch" — the suite errored
# out rather than running. importlib resolves each by full path, so duplicate
# basenames across packages are fine and no __init__.py files are needed.
addopts = --import-mode=importlib

# kaggle/ is RED BY DESIGN: kaggle/tests/test_fingerprint.py pins the contract for
# a fingerprint() that is deliberately left unimplemented (Eric's to write, see
# PLAYBOOK OP-5). Its docstring says to run it from kaggle/, and it imports
# push_datasets as a top-level module, which only resolves from there. Excluding
# it here keeps a root-level `pytest` honest — green means green — without
# pretending the stub is done. Run it explicitly:  cd kaggle && pytest -q
#
# .claude/worktrees holds full checkouts of this repo; collecting them would run
# every test several times over against stale copies.
norecursedirs = .claude .git __pycache__ node_modules kaggle *.egg-info

testpaths = nba nfl pga nhl mlb osrs sumo trades podcasts scrapekit v1
